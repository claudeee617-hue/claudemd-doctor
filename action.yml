name: "CLAUDE.md Doctor"
description: "Lint your CLAUDE.md in CI: catches stale paths, dead commands, vague rules and leaked secrets."
branding:
  icon: check-circle
  color: orange
inputs:
  path:
    description: "Repository root to check"
    default: "."
  fail-under:
    description: "Fail the job if the score is below this number"
    default: "80"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        pip install "$ACTION_PATH"
        claudemd-doctor lint "$INPUT_PATH" --fail-under "$INPUT_FAIL_UNDER"
