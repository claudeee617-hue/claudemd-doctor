[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claudemd-doctor"
version = "0.1.1"
description = "Generate and lint CLAUDE.md files so Claude Code actually follows them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude", "claude-code", "CLAUDE.md", "linter", "ai", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
claudemd-doctor = "claudemd_doctor.cli:main"

[tool.setuptools]
packages = ["claudemd_doctor"]

[project.urls]
Homepage = "https://github.com/claudeee617-hue/claudemd-doctor"
Issues = "https://github.com/claudeee617-hue/claudemd-doctor/issues"
