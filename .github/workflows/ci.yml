name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: Python 3.9 has no build for ubuntu-latest (Ubuntu 26.04).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests
      - name: Dogfood - lint our own CLAUDE.md
        run: claudemd-doctor lint . --fail-under 90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
